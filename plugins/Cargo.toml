# Separate workspace for plugin SDKs and first-party plugins. Kept out of the
# main crate's build so a plugin author's toolchain (wasm32 + wasm-tools) is not
# required to build Kinetix itself.
[workspace]
members = ["sdk", "antigravity-oauth"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
