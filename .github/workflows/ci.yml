name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      # Fixture / protocol-torture / fuzz suite (FR-9.4, FR-9.5, NFR-5.5).
      - name: Tests (unit + protocol torture/fuzz)
        run: cargo test --quiet

      - name: Release build (NFR-7.1)
        run: cargo build --release

      # End-to-end smoke test against the synthetic upstream (FR-9.2, FR-9.4).
      - name: End-to-end smoke
        run: scripts/smoke.sh 127.0.0.1:8180

      # Dependency vulnerability + license + ban checks (NFR-3.7).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
