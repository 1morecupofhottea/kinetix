name: release

# Publishes prebuilt Linux binaries (x86_64 + aarch64) to a GitHub Release when
# a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# Releases are intentionally tag-driven: nothing is published unless a version
# tag is explicitly created (the maintainer decides which versions ship).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for, e.g. v0.1.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Create release object if not present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Kinetix $TAG" --generate-notes --repo "${{ github.repository }}"
          fi

  binaries:
    name: build (${{ matrix.target }})
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard (embedded into the binary)
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Builds the target (using `cross` for non-native targets) and
      # uploads `kinetix-<tag>-<target>.tar.gz` to the release.
      - name: Build and upload binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kinetix
          target: ${{ matrix.target }}
          archive: kinetix-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    name: attestations & checksums
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Download all matrix release archives and compute unified SHA256SUMS
      - name: Generate SHA256SUMS and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cd dist
          gh release download "$TAG" --pattern "kinetix-*.tar.gz" --repo "${{ github.repository }}"
          sha256sum kinetix-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "${{ github.repository }}" --clobber

      # Attest build provenance for released binary archives
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/kinetix-*.tar.gz'
